name: build & deploy

# Build image amd64 native trên runner GitHub + ssh deploy VPS.
# main -> prod (có duyệt), develop -> staging (tự động).
on:
  push:
    branches: [main, develop]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/pinnguyen9x/json-server-blog
  VPS: pin@149.28.18.204

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Xác định tag
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=prod-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: pinnguyen9x
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push (amd64 native)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          push: true

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Chuẩn bị SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 149.28.18.204 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy lên VPS
        run: |
          TAG='${{ needs.build-push.outputs.tag }}'
          if [ "${{ github.ref_name }}" = "main" ]; then
            DIR=/opt/json-server-blog; CON=json-server-blog
          else
            DIR=/opt/json-server-blog-staging; CON=json-server-blog-staging
          fi
          ssh -o StrictHostKeyChecking=no "$VPS" "
            docker network create webnet 2>/dev/null || true
            export IMAGE=$IMAGE:$TAG CONTAINER=$CON
            cd $DIR && docker compose pull && docker compose up -d --remove-orphans && docker image prune -af
          "
